spring.datasource.url=jdbc:h2:mem:giftora_integration;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
app.assembly-migrations.enabled=false
app.cors.allowed-origins=http://localhost:3000
spring.mail.host=localhost
spring.mail.port=2525
jwt.secret=integrationTestSecretKeyForGiftoraJwtGeneration12345678901234567890
jwt.expiration=86400000
jwt.refresh.expiration=604800000
stripe.api.key=dummy_key_for_integration_tests
